{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    .wiki-translate-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-height: 1.5rem;
      margin: 0;
      padding: 0 0.35rem;
    }

    .wiki-translate-label {
      color: var(--md-default-fg-color--light);
      font-size: 0.7rem;
      font-weight: 700;
    }

    #google_translate_element {
      min-width: 7rem;
    }

    #google_translate_element select {
      min-height: 1.45rem;
      height: 1.45rem;
      padding: 0.05rem 0.3rem;
      font-size: 0.7rem;
      color: var(--md-default-fg-color);
      background: var(--md-default-bg-color);
      border: 1px solid var(--md-default-fg-color--lightest);
      border-radius: 0.2rem;
    }

    .goog-te-banner-frame,
    body > .skiptranslate {
      display: none !important;
    }

    body {
      top: 0 !important;
    }

    .wiki-header-translate {
      display: flex;
      align-items: center;
      margin-left: 0.35rem;
      padding: 0.18rem 0.3rem;
      background: var(--md-default-bg-color--light);
      border: 1px solid var(--md-default-fg-color--lightest);
      border-radius: 0.25rem;
    }
  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    function googleTranslateElementInit() {
      const header = document.querySelector(".md-header__inner");
      const search = header && header.querySelector(".md-search");
      if (!header || !search) {
        return;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "wiki-header-translate";
      wrapper.innerHTML =
        '<div class="wiki-translate-bar">' +
        '<span class="wiki-translate-label">언어</span>' +
        '<div id="google_translate_element"></div>' +
        '</div>';
      search.parentNode.insertBefore(wrapper, search.nextSibling);

      new google.translate.TranslateElement({
        pageLanguage: "ko",
        includedLanguages: "ko,en,ja,zh-CN,zh-TW,es,fr,de,pt,ru",
        autoDisplay: false
      }, "google_translate_element");
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
{% endblock %}
